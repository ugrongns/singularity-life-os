<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090A0F" />
    </radialGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="512" height="512" rx="140" fill="url(#bgGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Dış Dinamik Yörünge Halkaları -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="3" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="4" stroke-dasharray="24 16" />

  <!-- Merkez Singularity Sonsuzluk & Yaşam Enerjisi İkonu -->
  <g filter="url(#coreGlow)">
    <!-- Sol Döngü -->
    <path d="M 256 256 C 210 180, 130 180, 130 256 C 130 332, 210 332, 256 256 C 302 180, 382 180, 382 256 C 382 332, 302 332, 256 256 Z" 
          fill="none" stroke="url(#cyberGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Parlayan Çekirdek (Singularity Noktası) -->
    <circle cx="256" cy="256" r="18" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="28" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.8" />
  </g>
</svg>
