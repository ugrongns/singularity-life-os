<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Arka Plan Squircle (PWA & Tablet App Icon Standard) -->
  <rect width="512" height="512" rx="112" fill="url(#emeraldGrad)" />
  
  <!-- Üst Işık Yansıması -->
  <rect width="512" height="256" rx="112" fill="url(#shineGrad)" />
  
  <!-- İç İnce Çerçeve -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Beyaz Singularity Sonsuzluk Logosu (∞) -->
  <g filter="url(#shadow)">
    <path d="M 256 256 
             C 214 186, 126 186, 126 256 
             C 126 326, 214 326, 256 256 
             C 298 186, 386 186, 386 256 
             C 386 326, 298 326, 256 256 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>